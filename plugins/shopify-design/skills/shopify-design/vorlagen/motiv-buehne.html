<!-- Weiche Verlaufsbuehne mit freigestelltem Produkt rechts.
     Fuer Hero-Abschnitte, in denen der Text aus der Section links darueber liegt.
     Die linken 55 % bleiben deshalb bewusst ruhig und hell.
     Platzhalter: {{grund}} {{buehne}} {{akzent}} {{foto}} {{breite}} {{hoehe}} -->
<style>
*{margin:0;box-sizing:border-box}
body{width:{{breite}}px;height:{{hoehe}}px;overflow:hidden}
.b{width:100%;height:100%;position:relative;overflow:hidden;
  background:
    radial-gradient(115% 95% at 86% 6%,  {{buehne}} 0%, transparent 60%),
    radial-gradient(85% 105% at 6% 104%, {{akzent}} 0%, transparent 58%),
    radial-gradient(70% 60% at 100% 100%, {{akzent}} 0%, transparent 55%),
    {{grund}}}
.foto{position:absolute;left:56%;top:50%;transform:translateY(-50%);
  height:74%;display:flex;align-items:center;justify-content:center;width:26%}
.foto img{max-height:100%;max-width:100%;display:block;
  filter:drop-shadow(0 34px 46px rgba(20,60,90,.16))}
</style>
<div class="b"><div class="foto"><img src="{{foto}}"></div></div>
