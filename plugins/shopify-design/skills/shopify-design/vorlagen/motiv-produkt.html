<!-- Banner mit freigestelltem Produktfoto — das uebliche Shop-Muster.
     Links bleibt Platz fuer den Text, der aus der SECTION kommt, nicht aus dem Bild.
     Platzhalter: {{grund}} {{buehne}} {{foto}} {{breite}} {{hoehe}}
     Optional: {{stoerer_oben}} {{stoerer_gross}} {{stoerer_unten}} {{stoerer_farbe}} -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=IBM+Plex+Sans:wght@400&display=swap');
*{margin:0;box-sizing:border-box}
body{width:{{breite}}px;height:{{hoehe}}px;overflow:hidden;font-family:'IBM Plex Sans',sans-serif}
.b{width:100%;height:100%;background:{{grund}};position:relative;overflow:hidden}
.buehne{position:absolute;right:-6%;top:-42%;width:66%;padding-top:66%;border-radius:50%;
  background:{{buehne}}}
.schatten{position:absolute;right:8%;bottom:8%;width:44%;height:9%;border-radius:50%;
  background:rgba(0,0,0,.10);filter:blur(18px)}
.foto{position:absolute;right:9%;bottom:9%;width:40%;z-index:3}
.foto img{width:100%;display:block;filter:drop-shadow(0 26px 34px rgba(0,0,0,.24))}
.stoerer{position:absolute;left:56%;top:12%;width:14.5%;padding-top:14.5%;border-radius:50%;
  background:{{stoerer_farbe}};color:#fff;z-index:4;transform:rotate(-9deg);
  box-shadow:0 14px 30px rgba(0,0,0,.22)}
.stoerer .i{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.stoerer .k{font-size:1.45vw}
.stoerer .g{font-family:Archivo,sans-serif;font-size:4.6vw;line-height:.95;margin:1% 0 2%}
</style>
<div class="b">
  <div class="buehne"></div><div class="schatten"></div>
  <div class="stoerer"><div class="i">
    <span class="k">{{stoerer_oben}}</span>
    <span class="g">{{stoerer_gross}}</span>
    <span class="k">{{stoerer_unten}}</span>
  </div></div>
  <div class="foto"><img src="{{foto}}"></div>
</div>
